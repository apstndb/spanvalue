# CI mirrors local `make check` (fmt-check, vet, build, test, lint) plus
# race detection, Example tests, and govulncheck. The weekly vulnerability
# scan tracks newly published advisories.

name: Go

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
  # Weekly vulnerability scan (Sunday 00:00 UTC).
  - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          # Avoid stale module/build caches that can surface impossible typecheck
          # failures even when the current tree passes locally.
          cache: false

      - name: Clear Go caches
        run: go clean -cache -testcache

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.11.4
          install-only: true

      - name: make check
        run: make check

  race:
    name: race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Clear Go caches
        run: go clean -cache -testcache

      - name: Test with race detector
        run: go test -race ./...

  examples:
    name: example tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Clear Go caches
        run: go clean -cache -testcache

      - name: Run Example tests
        run: go test -run '^Example' ./...

  gospanner:
    name: dbsqlrows/gospanner (go 1.25)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: dbsqlrows/gospanner/go.mod
          cache: false

      - name: Clear Go caches
        run: go clean -cache -testcache

      - name: Test gospanner nested module
        working-directory: dbsqlrows/gospanner
        run: go test ./...

  govulncheck:
    name: govulncheck
    # Compare PRs with their base and report known findings on every run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Pull-request runs need the first parent of the merge commit.
          fetch-depth: 2
          persist-credentials: false

      # Build and run the scanner with the same current Go release.
      # The other root jobs continue to verify go.mod's minimum version.
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          check-latest: true
          cache: false

      - name: Scan both library modules
        run: |
          scan_dir="$(mktemp -d "$RUNNER_TEMP/spanvalue-vuln.XXXXXX")"
          base_checkout=""
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            git rev-parse --verify HEAD^2 >/dev/null
            base_checkout="$scan_dir/base"
            mkdir "$base_checkout"
            git archive HEAD^1 | tar -x -C "$base_checkout"
          fi
          GOBIN="$scan_dir" go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
          curl -fsSL --retry 2 https://vuln.go.dev/vulndb.zip -o "$scan_dir/vulndb.zip"
          unzip -q "$scan_dir/vulndb.zip" -d "$scan_dir/db"
          PATH="$scan_dir:$PATH" bash .github/scripts/vulncheck.sh "file://$scan_dir/db" "$base_checkout"
